<!DOCTYPE html>
<!--
  TipTop — page d'acceptation d'une invitation à collaborer.
  Reçoit ?token=... , exige une connexion (le collaborateur doit avoir un compte),
  puis appelle collab-join qui vérifie le jeton côté serveur et accorde l'accès.

  v1.22.0 — l'invitation n'est plus consommée d'office. Un premier appel en mode
  aperçu valide le lien sans rien écrire ; la page nomme alors le compte connecté
  et demande de confirmer, ou d'en changer. Ouvrir un lien dans un navigateur
  déjà connecté accordait auparavant l'accès au compte en place, sans le dire.
  Le propriétaire qui ouvre son propre lien en est averti et rien n'est consommé.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="shared/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="shared/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="shared/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="shared/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Anti-FOUC i18n : les textes en dur du HTML sont en français. Si la langue
     effective n'est pas le français, on masque brièvement le corps le temps que
     i18n.js applique les traductions, pour éviter un flash de texte français.
     Un francophone ne subit aucun délai. Filet de sécurité : révélation forcée
     au bout de 1,2 s si le script ne se chargeait pas. -->
<link rel="stylesheet" href="shared/theme.css">
<style>html.i18n-pending body{visibility:hidden}</style>
<script>
/* Thème posé avant le premier rendu : sans cela, le thème par défaut
   apparaîtrait brièvement avant d'être remplacé. */
(function(){try{
  if(localStorage.getItem("tiptop_theme")==="mono")
    document.documentElement.setAttribute("data-theme","mono");
}catch(e){}})();
</script>
<script>
(function(){
  try{
    var stored = localStorage.getItem("tiptop_lang");
    var lang = stored || (navigator.language || "").slice(0,2).toLowerCase();
    if(lang !== "fr"){
      document.documentElement.classList.add("i18n-pending");
      setTimeout(function(){ document.documentElement.classList.remove("i18n-pending"); }, 1200);
    }
  }catch(e){}
})();
</script>

<title>Rejoindre un plan de table — TipTop</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,system-ui,sans-serif; padding:20px; }
  .card{ background:var(--panel); border-radius:14px; padding:32px; max-width:440px; width:100%;
         box-shadow:0 8px 30px rgba(80,68,20,.10); text-align:center; }
  h1{ font-family:Georgia,serif; font-size:22px; margin:0 0 8px; }
  p{ font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 18px; }
  .msg{ font-size:14px; margin-top:12px; }
  .msg.error{ color:var(--danger); }
  button{ width:100%; padding:11px; border:none; border-radius:8px; background:var(--ink);
          color:var(--panel); font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled{ opacity:.6; cursor:progress; }
  button.secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--line-strong); margin-top:10px; }
  .who{ font-size:13px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line);
        border-radius:8px; padding:10px 12px; margin:0 0 18px; line-height:1.5; word-break:break-word; }
  .role{ display:inline-block; background:var(--warn-soft); border:1px solid var(--accent);
         border-radius:6px; padding:3px 10px; font-size:12px; font-weight:600; margin-bottom:14px; }
  .brand-logo{height:47px;margin:0 auto 12px}
</style>
</head>
<body>
<div class="card">
  <img class="brand-logo auth-logo" src="shared/logo.svg" alt="TipTop" width="40" height="47">
  <h1 id="title" data-i18n="join_title">Rejoindre un plan de table</h1>
  <p id="sub" data-i18n="join_checking">Vérification de votre invitation…</p>
  <div id="actions"></div>
  <div class="msg" id="msg"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/i18n.js"></script>
<script>
const sb = window.getSupabaseClient();
const title = document.getElementById("title");
const sub = document.getElementById("sub");
const msg = document.getElementById("msg");
const actions = document.getElementById("actions");

function token(){ return new URLSearchParams(location.search).get("token") || ""; }

function esc(v){
  return String(v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function roleLabel(role){
  return role === "viewer" ? t("ed_role_viewer")
       : role === "owner" ? t("role_owner") : t("ed_role_placer");
}
function openEvent(id){ location.href = "event.html?event=" + encodeURIComponent(id); }

async function callJoin(session, tok, preview){
  const res = await fetch(`${window.SUPABASE_URL}/functions/v1/collab-join`, {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization": `Bearer ${session.access_token}` },
    body: JSON.stringify({ token: tok, preview })
  });
  return res.json();
}

/* Changer de compte : la session courante est fermée AVANT de repartir vers
   l'authentification, sinon auth.html la retrouverait et renverrait ici avec
   le même compte. Le lien est conservé pour revenir ensuite. */
async function switchAccount(tok){
  try { await sb.auth.signOut(); } catch (e) {}
  location.href = "auth.html?next=" + encodeURIComponent("join.html?token=" + encodeURIComponent(tok));
}

function showGranted(data){
  title.removeAttribute("data-i18n");
  sub.removeAttribute("data-i18n");
  title.textContent = t("join_granted");
  sub.innerHTML = t("join_you_have_access", { name: esc(data.eventName || "—") })
                  + `<br><span class="role">${roleLabel(data.role)}</span>`;
  actions.innerHTML = '<button id="open">' + t("join_open") + '</button>';
  document.getElementById("open").addEventListener("click", ()=>openEvent(data.eventId));
}

function fail(text){
  title.removeAttribute("data-i18n");
  sub.removeAttribute("data-i18n");
  title.textContent = t("join_unavailable");
  sub.textContent = text;
  actions.innerHTML = '<button onclick="location.href=\'index.html\'">' + t("join_back_home") + '</button>';
}

(async () => {
  const tok = token();
  if(!tok){ fail(t("join_incomplete")); return; }

  // Le collaborateur doit avoir un compte : sans session, on l'envoie s'inscrire ou
  // se connecter, en conservant le lien pour revenir ici ensuite.
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    sub.removeAttribute("data-i18n");
    sub.textContent = t("join_need_account");
    const next = encodeURIComponent("join.html?token=" + encodeURIComponent(tok));
    actions.innerHTML = '<button id="go">' + t("join_continue") + '</button>';
    document.getElementById("go").addEventListener("click", ()=>{
      location.href = "auth.html?next=" + next;
    });
    return;
  }

  // Session présente : d'abord un APERÇU, qui valide le lien sans rien écrire.
  let data;
  try {
    data = await callJoin(session, tok, true);
  } catch (e) {
    fail(t("join_cannot_verify")); return;
  }
  if(data.error){ fail(data.error); return; }

  /* Fonction collab-join antérieure à la v1.22.0 : elle ignore `preview` et a
     donc DÉJÀ accordé l'accès. Afficher une confirmation serait mentir — on
     affiche le résultat, comme avant. */
  if(data.preview !== true && !data.alreadyOwner){ showGranted(data); return; }

  const email = session.user && session.user.email ? session.user.email : "—";
  title.removeAttribute("data-i18n");
  sub.removeAttribute("data-i18n");

  if(data.alreadyOwner){
    title.textContent = t("join_own_title");
    sub.innerHTML = t("join_own_msg", { name: esc(data.eventName || "—") });
    actions.innerHTML = '<p class="who">' + t("join_signed_in_as", { email: esc(email) }) + '</p>'
      + '<button id="open">' + t("join_open") + '</button>'
      + '<button id="switch" class="secondary">' + t("join_switch_account") + '</button>';
    document.getElementById("open").addEventListener("click", ()=>openEvent(data.eventId));
    document.getElementById("switch").addEventListener("click", ()=>switchAccount(tok));
    return;
  }

  title.textContent = t("join_confirm_title");
  sub.innerHTML = t("join_invited_to", { name: esc(data.eventName || "—") })
                  + `<br><span class="role">${roleLabel(data.role)}</span>`;
  const note = data.alreadyMember ? t("join_already_member") : t("join_access_to_account");
  actions.innerHTML = '<p class="who">' + t("join_signed_in_as", { email: esc(email) }) + '<br>' + note + '</p>'
    + '<button id="accept">' + t("join_continue_as") + '</button>'
    + '<button id="switch" class="secondary">' + t("join_switch_account") + '</button>';
  document.getElementById("switch").addEventListener("click", ()=>switchAccount(tok));
  document.getElementById("accept").addEventListener("click", async (e)=>{
    e.currentTarget.disabled = true;
    document.getElementById("switch").disabled = true;
    try {
      const res = await callJoin(session, tok, false);
      if(res.error){ fail(res.error); return; }
      showGranted(res);
    } catch (err) {
      fail(t("join_cannot_verify"));
    }
  });
})();
</script>
</body>
</html>
