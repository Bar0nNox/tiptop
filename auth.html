<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="shared/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="shared/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="shared/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="shared/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Anti-FOUC i18n : les textes en dur du HTML sont en français. Si la langue
     effective n'est pas le français, on masque brièvement le corps le temps que
     i18n.js applique les traductions, pour éviter un flash de texte français.
     Un francophone ne subit aucun délai. Filet de sécurité : révélation forcée
     au bout de 1,2 s si le script ne se chargeait pas. -->
<link rel="stylesheet" href="shared/theme.css">
<style>html.i18n-pending body{visibility:hidden}  .alt-links{ text-align:center; margin-top:14px; }
  .link-btn{ background:none; border:none; padding:4px; font-family:inherit; font-size:13px;
             color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .link-btn:hover{ color:var(--ink); }
</style>
<script>
/* Thème posé avant le premier rendu : sans cela, le thème par défaut
   apparaîtrait brièvement avant d'être remplacé. */
(function(){try{
  if(localStorage.getItem("tiptop_theme")==="mono")
    document.documentElement.setAttribute("data-theme","mono");
}catch(e){}})();
</script>
<script>
(function(){
  try{
    var stored = localStorage.getItem("tiptop_lang");
    var lang = stored || (navigator.language || "").slice(0,2).toLowerCase();
    if(lang !== "fr"){
      document.documentElement.classList.add("i18n-pending");
      setTimeout(function(){ document.documentElement.classList.remove("i18n-pending"); }, 1200);
    }
  }catch(e){}
})();
</script>

<title>Connexion — TipTop</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/i18n.js"></script>
<style>
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--bg); font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); }
  .card{ width:360px; max-width:92vw; background:var(--panel); border-radius:14px; padding:32px;
         box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1{ font-size:20px; margin:0 0 4px; }
  p.sub{ margin:0 0 20px; color:var(--ink-soft); font-size:14px; }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tabs button{ flex:1; padding:8px; border:none; background:var(--panel-2); border-radius:8px;
                cursor:pointer; font-size:14px; color:var(--ink); }
  .tabs button.active{ background:var(--accent); color:var(--panel); font-weight:600; }
  label{ display:block; font-size:13px; margin:12px 0 4px; }
  input{ width:100%; padding:10px; border:1px solid var(--line-strong); border-radius:8px; font-size:14px; }
  button.primary{ width:100%; margin-top:18px; padding:11px; border:none; border-radius:8px;
                  background:var(--ink); color:var(--panel); font-size:14px; cursor:pointer; }
  button.google{ width:100%; margin-top:10px; padding:10px; border:1px solid var(--line-strong); border-radius:8px;
                 background:var(--panel); cursor:pointer; font-size:14px; display:flex; align-items:center;
                 justify-content:center; gap:8px; }
  .msg{ margin-top:14px; font-size:13px; }
  .msg.error{ color:var(--err); }
  .msg.ok{ color:var(--ok); }
  .divider{ text-align:center; color:var(--ink-faint); font-size:12px; margin:16px 0 6px; }
  /* État chargement des boutons */
  button.primary:disabled, button.google:disabled{ opacity:.65; cursor:progress; }
  .spinner{ display:inline-block; width:14px; height:14px; margin-right:8px; vertical-align:-2px;
            border:2px solid rgba(255,255,255,.45); border-top-color:var(--panel); border-radius:50%;
            animation:spin .6s linear infinite; }
  button.google .spinner{ border:2px solid rgba(0,0,0,.2); border-top-color:#555; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .lang-switch{ background:var(--panel); border:1px solid var(--line-strong); border-radius:7px; padding:4px 7px;
                font-size:12.5px; color:var(--ink); font-family:inherit; cursor:pointer; }
  .brand-logo{height:52px;margin:0 auto 14px}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:right;margin-bottom:6px"><span id="langSlot"></span></div>
  <img class="brand-logo auth-logo" src="shared/logo.svg" alt="TipTop" width="44" height="52">
  <h1 id="title" data-i18n="auth_signin">Connexion</h1>
  <p class="sub" id="subtitle" data-i18n="auth_sub_login">Accédez à vos plans de table.</p>

  <div class="tabs">
    <button id="tabLogin" class="active" data-i18n="auth_signin">Connexion</button>
    <button id="tabSignup" data-i18n="auth_signup">Créer un compte</button>
  </div>

  <form id="authForm">
    <label for="email" data-i18n="auth_email">Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label for="password" data-i18n="auth_password">Mot de passe</label>
    <input type="password" id="password" required autocomplete="current-password" minlength="8">
    <button type="submit" class="primary" id="submitBtn" data-i18n="auth_signin_btn">Se connecter</button>
  </form>

  <div class="divider" data-i18n="auth_or">ou</div>
  <button class="google" id="googleBtn" data-i18n="auth_google">Continuer avec Google</button>

  <div class="alt-links">
    <button type="button" class="link-btn" id="forgotLink" data-i18n="auth_forgot_link">Mot de passe oublié ?</button>
    <button type="button" class="link-btn" id="backToLogin" data-i18n="auth_back_to_login" style="display:none">← Retour à la connexion</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const sb = window.getSupabaseClient();
let mode = "login"; // "login" | "signup"

const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const submitBtn = document.getElementById("submitBtn");
const msg = document.getElementById("msg");

function setMode(m){
  mode = m;
  tabLogin.classList.toggle("active", m==="login");
  tabSignup.classList.toggle("active", m==="signup");
  if(typeof setForgotMode === "function" && mode === "forgot"){ /* rétabli plus bas */ }
  title.textContent = m==="login" ? t("auth_signin") : t("auth_signup");
  subtitle.textContent = m==="login" ? t("auth_sub_login") : t("auth_sub_signup");
  submitBtn.textContent = m==="login" ? t("auth_signin_btn") : t("auth_signup_btn");
  msg.textContent = ""; msg.className = "msg";
}
tabLogin.addEventListener("click", ()=>setMode("login"));
tabSignup.addEventListener("click", ()=>setMode("signup"));

/* ---- Mot de passe oublié ----
   Troisième mode de la même carte : seule l'adresse est demandée. */
const forgotLink  = document.getElementById("forgotLink");
const backToLogin = document.getElementById("backToLogin");
const tabsEl      = document.querySelector(".tabs");
const passLabel   = document.querySelector('label[for="password"]');
const passInput   = document.getElementById("password");
const dividerEl   = document.querySelector(".divider");
const googleEl    = document.getElementById("googleBtn");

function setForgotMode(on){
  mode = on ? "forgot" : "login";
  tabsEl.style.display    = on ? "none" : "";
  passLabel.style.display = on ? "none" : "";
  passInput.style.display = on ? "none" : "";
  passInput.required      = !on;
  dividerEl.style.display = on ? "none" : "";
  googleEl.style.display  = on ? "none" : "";
  forgotLink.style.display  = on ? "none" : "";
  backToLogin.style.display = on ? "" : "none";
  title.removeAttribute("data-i18n"); subtitle.removeAttribute("data-i18n");
  submitBtn.removeAttribute("data-i18n");
  title.textContent     = on ? t("auth_forgot_title") : t("auth_signin");
  subtitle.textContent  = on ? t("auth_forgot_sub")   : t("auth_sub_login");
  submitBtn.textContent = on ? t("auth_forgot_btn")   : t("auth_signin_btn");
  msg.textContent = ""; msg.className = "msg";
}
forgotLink.addEventListener("click", ()=>setForgotMode(true));
backToLogin.addEventListener("click", ()=>setForgotMode(false));

function nextUrl(){
  const params = new URLSearchParams(location.search);
  return params.get("next") || "dashboard.html";
}

/* Bascule un bouton en état chargement (spinner + texte) et le restaure. */
function setLoading(btn, isLoading, loadingLabel){
  if(isLoading){
    btn.dataset.label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>' + (loadingLabel || t("auth_wait"));
  } else {
    btn.disabled = false;
    if(btn.dataset.label !== undefined){ btn.innerHTML = btn.dataset.label; delete btn.dataset.label; }
  }
}

document.getElementById("authForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  msg.textContent = ""; msg.className = "msg";
  if(mode === "forgot"){
    setLoading(submitBtn, true, t("auth_forgot_sending"));
    // `redirectTo` doit être déclaré dans Supabase > Authentication > URL Configuration.
    await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/reset.html" });
    setLoading(submitBtn, false);
    /* Message volontairement identique que l'adresse existe ou non : révéler
       l'existence d'un compte permettrait d'énumérer les clients. */
    msg.textContent = t("auth_forgot_sent");
    msg.className = "msg ok";
    return;
  }

  setLoading(submitBtn, true, mode === "login" ? t("auth_logging_in") : t("auth_creating"));

  if(mode === "login"){
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ msg.textContent = t("auth_bad_credentials"); msg.className = "msg error"; setLoading(submitBtn, false); return; }
    location.href = nextUrl();
  } else {
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ msg.textContent = error.message; msg.className = "msg error"; setLoading(submitBtn, false); return; }
    setLoading(submitBtn, false);
    // Basculer en mode connexion AVANT d'afficher le message (setMode réinitialise msg).
    setMode("login");
    // Cas où l'email de confirmation est désactivé : session immédiate → rediriger.
    if(data && data.session){ location.href = nextUrl(); return; }
    msg.textContent = t("auth_account_created");
    msg.className = "msg ok";
  }
});

document.getElementById("googleBtn").addEventListener("click", async (e)=>{
  setLoading(e.currentTarget, true, t("auth_redirecting"));
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + "/" + nextUrl() }
  });
  // En cas de succès, le navigateur est redirigé vers Google (le spinner reste affiché,
  // c'est voulu). En cas d'erreur, on restaure le bouton.
  if(error){ setLoading(e.currentTarget, false); msg.textContent = t("auth_google_unavailable"); msg.className = "msg error"; }
});

// Si déjà connecté, ne pas rester sur cette page.
(async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session) location.href = nextUrl();
})();
mountLangSwitcher(document.getElementById("langSlot"));
</script>
</body>
</html>
