<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="shared/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="shared/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="shared/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="shared/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Anti-FOUC i18n : les textes en dur du HTML sont en français. Si la langue
     effective n'est pas le français, on masque brièvement le corps le temps que
     i18n.js applique les traductions, pour éviter un flash de texte français.
     Un francophone ne subit aucun délai. Filet de sécurité : révélation forcée
     au bout de 1,2 s si le script ne se chargeait pas. -->
<link rel="stylesheet" href="shared/theme.css">
<style>html.i18n-pending body{visibility:hidden}
</style>
<script>
/* Thème posé avant le premier rendu : sans cela, le thème par défaut
   apparaîtrait brièvement avant d'être remplacé. */
(function(){try{
  if(localStorage.getItem("tiptop_theme")==="mono")
    document.documentElement.setAttribute("data-theme","mono");
}catch(e){}})();
</script>
<script>
(function(){
  try{
    var stored = localStorage.getItem("tiptop_lang");
    var lang = stored || (navigator.language || "").slice(0,2).toLowerCase();
    if(lang !== "fr"){
      document.documentElement.classList.add("i18n-pending");
      setTimeout(function(){ document.documentElement.classList.remove("i18n-pending"); }, 1200);
    }
  }catch(e){}
})();
</script>

<title>Mes événements — TipTop</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/ui-modal.js"></script>
<style>
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); }
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
          background:var(--panel); box-shadow:0 1px 0 rgba(0,0,0,.06); }
  header h1{ font-size:18px; margin:0; }
  header button{ border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:13px; }
  .profile-wrap{ position:relative; }
  #profileBtn{ display:flex; align-items:center; gap:8px; padding:5px 9px 5px 5px;
               border-radius:22px; transition:background .12s; }
  #profileBtn:hover{ background:var(--panel-2); }
  .avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--on-accent);
           display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px; }
  .profile-mail{ font-size:13px; color:var(--ink-soft); max-width:170px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .profile-menu{ position:absolute; right:0; top:calc(100% + 8px); background:var(--panel);
                 border:1px solid var(--line); border-radius:11px; box-shadow:0 10px 30px rgba(60,50,15,.14);
                 min-width:190px; padding:5px; display:none; z-index:60; }
  .profile-menu.open{ display:block; }
  .profile-menu a, .profile-menu button{ display:block; width:100%; text-align:left;
        padding:9px 11px; border-radius:8px; font-size:13.5px; color:var(--ink);
        text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit; }
  .profile-menu a:hover, .profile-menu button:hover{ background:var(--panel-2); }
  .profile-menu button{ color:var(--ink-soft); }
  .lang-switch{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  @media (max-width:600px){ .profile-mail{ display:none; } }
  main{ max-width:900px; margin:0 auto; padding:28px 20px; }
  .banner{ padding:14px 18px; border-radius:10px; margin-bottom:20px; font-size:14px; display:flex;
           align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .banner.inactive{ background:var(--danger-soft); color:var(--danger); }
  .banner.active{ background:var(--ok-soft); color:var(--ok); }
  .banner button{ border:none; padding:8px 14px; border-radius:8px; background:var(--ink); color:var(--panel);
                  font-size:13px; cursor:pointer; }
  .banner button:disabled{ opacity:.6; cursor:progress; }
  .plan-choice{ display:flex; gap:8px; flex-wrap:wrap; }
  .plan-choice #subAnnual{ background:var(--accent, var(--accent)); color:var(--ink); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card{ background:var(--panel); border-radius:12px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.05);
         cursor:pointer; position:relative; }
  .card h3{ margin:0 0 6px; font-size:15px; }
  .card p{ margin:0; font-size:12px; color:var(--ink-faint); }
  .card .del{ position:absolute; top:10px; right:10px; border:none; background:none; color:var(--danger);
              cursor:pointer; font-size:12px; }
  .new{ border:2px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
        color:var(--ink-faint); font-size:14px; min-height:88px; }
  .empty{ text-align:center; color:var(--ink-faint); margin-top:60px; font-size:14px; }
  .brand-logo{height:34px}
  header h1{display:flex;align-items:center;margin:0}
</style>
</head>
<body>
<header>
  <h1><img class="brand-logo" src="shared/logo.svg" alt="TipTop" width="30" height="35"></h1>
  <div class="profile-wrap">
    <button id="profileBtn" aria-haspopup="true" aria-expanded="false" data-i18n-title="my_account" title="Mon compte">
      <span class="avatar" id="avatar">?</span>
      <span class="profile-mail" id="profileMail"></span>
    </button>
    <div class="profile-menu" id="profileMenu" role="menu">
      <a href="account.html" role="menuitem" data-i18n="my_account">Mon compte</a>
      <div style="padding:6px 11px"><span id="langSlot"></span></div>
      <button id="signOut" role="menuitem" data-i18n="logout">Se déconnecter</button>
    </div>
  </div>
</header>
<main>
  <div id="banner" class="banner"></div>
  <div id="grid" class="grid"></div>
</main>

<script>
const sb = window.getSupabaseClient();
let session, profile;

async function init(){
  session = await window.requireAuth();
  if(!session) return;
  // Menu profil : initiale et adresse de l'utilisateur connecté.
  const mail = session.user.email || "";
  document.getElementById("avatar").textContent = (mail[0] || "?").toUpperCase();
  document.getElementById("profileMail").textContent = mail;
  profile = await window.fetchProfile(session.user.id);
  await handleReturnFromCore();   // gère le retour de la page d'enregistrement de carte
  renderBanner();
  await loadEvents();
}

/* Retour depuis la page hébergée Core :
   - ?card=saved&plan=... → la carte a été enregistrée : on déclenche le 1er prélèvement.
   - ?card=error          → l'enregistrement a échoué.
   - ?paid=1 / ?paid=0    → retour après le prélèvement (info ; la confirmation réelle
                            vient du callback serveur, on rafraîchit le profil). */
async function handleReturnFromCore(){
  const q = new URLSearchParams(location.search);
  const clean = ()=> history.replaceState({}, "", location.pathname);

  if(q.get("card") === "saved"){
    const period = q.get("plan") === "annual" ? "annual" : "monthly";
    setBannerMessage(t("dash_finalizing"));
    const { paymentPageUrl, error } = await callFunction("core-charge", { period });
    if(error){ clean(); await uiAlert({ title:t("dash_pay_not_init"), message:error }); return; }
    if(paymentPageUrl){ location.href = paymentPageUrl; return; } // validation client requise
    await refreshProfileUntilActive();
    clean();
  } else if(q.get("card") === "error"){
    clean(); await uiAlert({ title:t("dash_card_failed_title"), message:t("dash_card_failed_msg") });
  } else if(q.has("paid")){
    await refreshProfileUntilActive();
    clean();
  }
}

/* Après un paiement, le callback serveur active l'abonnement de façon asynchrone.
   On re-lit le profil quelques fois pour refléter l'activation sans recharger la page. */
async function refreshProfileUntilActive(tries=6){
  for(let i=0;i<tries;i++){
    profile = await window.fetchProfile(session.user.id);
    if(profile && ["active","trialing"].includes(profile.subscription_status)) break;
    await new Promise(r=>setTimeout(r, 1500));
  }
}

function setBannerMessage(msg){
  const el = document.getElementById("banner");
  el.className = "banner"; el.innerHTML = `<span>${msg}</span>`;
}

function renderBanner(){
  const el = document.getElementById("banner");
  const status = profile && profile.subscription_status;
  const periodLabel = profile && profile.plan_period === "annual" ? t("period_annual") : t("period_monthly");
  const endLabel = profile && profile.current_period_end
    ? new Date(profile.current_period_end).toLocaleDateString("fr-FR")
    : null;

  if(status === "trialing"){
    // Essai sans carte : aucun prélèvement automatique. On invite à s'abonner.
    const days = profile.current_period_end
      ? Math.max(0, Math.ceil((new Date(profile.current_period_end) - new Date()) / 86400000))
      : null;
    el.className = "banner active";
    el.innerHTML = `<span>${t("dash_days_left", { n: days !== null ? days : 0 })}</span>
      <span class="plan-choice">
        <button id="subMonthly">${t("dash_sub_monthly")}</button>
        <button id="subAnnual">${t("dash_sub_annual")}</button>
      </span>`;
  } else if(status === "active"){
    el.className = "banner active";
    el.innerHTML = `<span>${t("dash_active_until", { period: periodLabel, date: endLabel || "—" })}</span>`;
  } else if(status === "past_due"){
    el.className = "banner inactive";
    el.innerHTML = `<span>${t("dash_past_due_msg")}</span>`;
  } else {
    el.className = "banner inactive";
    const trialUsed = profile && profile.trial_started_at;
    el.innerHTML = `<span>${t("dash_inactive_trial_over")}</span>
      <span class="plan-choice">
        <button id="subMonthly">${t("dash_sub_monthly")}</button>
        <button id="subAnnual">${t("dash_sub_annual")}</button>
      </span>`;
  }

  // Les boutons d'abonnement existent dans plusieurs états (essai, essai terminé,
  // sans abonnement) : on les branche une seule fois, ici.
  const bM = document.getElementById("subMonthly");
  const bA = document.getElementById("subAnnual");
  if(bM) bM.addEventListener("click", ()=>startSubscription("monthly"));
  if(bA) bA.addEventListener("click", ()=>startSubscription("annual"));
}

async function callFunction(name, body){
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch(`${window.SUPABASE_URL}/functions/v1/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}` },
    body: JSON.stringify(body || {})
  });
  return res.json();
}

/* Démarre l'abonnement : enregistre la carte via Core, puis redirige vers la page
   hébergée. Le premier prélèvement se fera au retour (voir handleReturnFromCore). */
async function startSubscription(period){
  const btn = document.getElementById(period === "annual" ? "subAnnual" : "subMonthly");
  if(btn){ btn.disabled = true; btn.textContent = t("dash_redirecting"); }
  const { paymentPageUrl, error } = await callFunction("core-register-card", { period });
  if(error || !paymentPageUrl){
    if(btn){ btn.disabled = false; btn.textContent = period === "annual" ? t("dash_sub_annual") : t("dash_sub_monthly"); }
    await uiAlert({ title:t("dash_sub_indisponible"),
      message:t("dash_sub_unavailable_msg", { reason: error || t("dash_invalid_response") }) });
    return;
  }
  location.href = paymentPageUrl;
}

async function loadEvents(){
  const grid = document.getElementById("grid");
  const { data: events, error } = await sb.from("events").select("*").order("updated_at", { ascending:false });
  grid.innerHTML = "";
  if(error){
    grid.innerHTML = `<p class="empty">${t("dash_load_error")}</p>`;
    return;
  }
  events.forEach(ev=>{
    const isOwner = ev.owner_id === session.user.id;
    const card = document.createElement("div");
    card.className = "card";
    // Un collaborateur ne peut pas supprimer : le bouton n'apparaît que pour le
    // propriétaire (la base le refuserait de toute façon).
    card.innerHTML = `${isOwner ? `<button class="del" data-id="${ev.id}">${t("delete")}</button>` : ""}
      <h3>${escapeHtml(ev.name)}</h3>
      <p>${ev.event_date
            ? t("dash_event_on", { date: formatEventDate(ev.event_date) })
            : t("dash_modified", { date: new Date(ev.updated_at).toLocaleDateString(dateLocale()) })}${
        isOwner ? "" : ` · <span style="color:var(--warn);font-weight:600">${t("dash_shared_badge")}</span>`}</p>`;
    card.addEventListener("click", (e)=>{
      if(e.target.closest(".del")) return;
      location.href = `event.html?event=${ev.id}`;
    });
    grid.appendChild(card);
  });
  const newCard = document.createElement("div");
  newCard.className = "card new";
  newCard.textContent = t("dash_new_event");
  newCard.addEventListener("click", createEvent);
  grid.appendChild(newCard);

  grid.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      // Pendant l'essai, la suppression est irréversible au sens fort : le quota
      // d'un événement est déjà consommé et ne se libère pas.
      const inTrial = profile && profile.subscription_status === "trialing";
      const ok = await uiDanger({
        title:t("dash_del_event_title"),
        message: inTrial ? t("dash_del_event_msg_trial") : t("dash_del_event_msg"),
        confirmLabel:t("delete"),
        cancelLabel:t("dash_keep")
      });
      if(!ok) return;
      await sb.from("events").delete().eq("id", btn.dataset.id);
      loadEvents();
    });
  });
}

async function createEvent(){
  const active = profile && ["active","trialing"].includes(profile.subscription_status);
  if(!active){
    await uiAlert({ title:t("dash_sub_needed_title"), message:t("dash_sub_needed_msg") });
    return;
  }
  const name = await uiPrompt({
    title:t("dash_new_event_name"),
    label:t("dash_event_name_label"),
    value:t("dash_new_event_name"),
    confirmLabel:t("create")
  });
  if(name === null) return;
  const { data, error } = await sb.from("events").insert({
    owner_id: session.user.id, name: name || "Nouvel événement",
    doc: { guests: [], tables: [], nextTable: 1, eventName: name || "Nouvel événement" }
  }).select().single();
  if(error){
    // Le trigger de base refuse un second événement pendant l'essai (règle serveur).
    if(String(error.message).includes("TRIAL_EVENT_LIMIT")){
      await uiAlert({ title:t("dash_trial_one_event_title"), message:t("dash_trial_one_event_msg") });
    } else {
      await uiAlert({ title:t("dash_create_failed"), message:error.message });
    }
    return;
  }
  location.href = `event.html?event=${data.id}`;
}

/* Format de date selon la langue. Découpage manuel pour la date d'événement :
   `new Date("2027-06-14")` est interprété en UTC et peut afficher la veille
   selon le fuseau du lecteur. */
function dateLocale(){
  return (typeof getLang === "function" && getLang() === "en") ? "en-GB" : "fr-FR";
}
function formatEventDate(iso){
  if(!iso) return "";
  const [a,m,j] = iso.split("-").map(Number);
  return new Date(a, m-1, j).toLocaleDateString(dateLocale(), { day:"numeric", month:"long", year:"numeric" });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Menu profil : ouverture, fermeture au clic extérieur et à Échap. */
(function(){
  const btn = document.getElementById("profileBtn");
  const menu = document.getElementById("profileMenu");
  function setOpen(open){
    menu.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", (e)=>{ e.stopPropagation(); setOpen(!menu.classList.contains("open")); });
  document.addEventListener("click", (e)=>{ if(!e.target.closest(".profile-wrap")) setOpen(false); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") setOpen(false); });
})();

document.getElementById("signOut").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  location.href = "auth.html";
});

init();
mountLangSwitcher(document.getElementById("langSlot"));
</script>
</body>
</html>
